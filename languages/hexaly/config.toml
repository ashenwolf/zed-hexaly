name = "Hexaly"
grammar = "hexaly"

path_suffixes = ["hxm"]

line_comments = ["// "]
block_comment = ["/* ", " */"]

tab_size = 4
hard_tabs = false

autoclose_before = ";:.,=}])>"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
