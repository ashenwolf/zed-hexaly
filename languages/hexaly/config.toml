name = "Hexaly"
grammar = "hexaly"

# .lsp is the legacy LocalSolver extension; the official Hexaly VS Code extension still
# claims it, so models predating the rebrand keep working.
path_suffixes = ["hxm", "lsp"]

line_comments = ["// "]
block_comment = ["/* ", " */"]

tab_size = 4
hard_tabs = false

autoclose_before = ";:.,=}])>"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
